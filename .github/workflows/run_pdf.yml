name: Generate PDF From Google Sheets

on:
  workflow_dispatch:
  repository_dispatch:
    types: [generate_pdf]

permissions:
  contents: write

env:
  # 🚀 Forces the runner to use Node.js 24 to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5 # Updated from v4

      - name: Setup Python
        uses: actions/setup-python@v6 # Updated from v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install gspread google-api-python-client google-auth pandas requests reportlab PyPDF2

      - name: Run PDF Generator
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python professional_pdf_generator.py

      - name: Upload PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Catalog PDF
          files: PROFESSIONAL_CATALOG.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
