name: Generate PDF From Google Sheets

on:
  workflow_dispatch:
    inputs:
      target_script:
        description: 'Which PDF to generate?'
        required: true
        default: 'both'
        type: choice
        options:
          - main
          - discount
          - both

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install gspread google-api-python-client google-auth pandas requests reportlab PyPDF2

      # Run Main Script if 'main' or 'both' is selected
      - name: Run Main PDF Generator
        if: github.event.inputs.target_script == 'main' || github.event.inputs.target_script == 'both'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python professional_pdf_generator.py

      # Run Discount Script if 'discount' or 'both' is selected
      - name: Run Discounted PDF Generator
        if: github.event.inputs.target_script == 'discount' || github.event.inputs.target_script == 'both'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python discon_script.py

      - name: Upload PDFs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Catalog PDF
          files: |
            PROFESSIONAL_CATALOG.pdf
            PROFESSIONAL_CATALOG_DISCON.pdf
          fail_on_unmatched_files: false # Prevents error if only 1 file exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
