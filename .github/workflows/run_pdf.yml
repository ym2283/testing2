name: Generate PDF From Google Sheets

on:
  workflow_dispatch:
  repository_dispatch:
    types: [generate_pdf]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install gspread google-api-python-client google-auth pandas requests reportlab PyPDF2

      # ===============================
      # 🔍 Decide which script to run
      # ===============================
      - name: Decide which script to run
        id: decide
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          RESULT=$(python -c "
import gspread, json, os

creds=json.loads(os.environ['GOOGLE_CREDENTIALS_JSON'])
gc=gspread.service_account_from_dict(creds)

sheet=gc.open_by_key(os.environ['SPREADSHEET_ID']).sheet1

print(sheet.acell('A1').value)
")

          echo "result=$RESULT" >> $GITHUB_OUTPUT

      # ===============================
      # 📄 Run MAIN PDF generator
      # ===============================
      - name: Run Main PDF Generator
        if: steps.decide.outputs.result == 'main'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python professional_pdf_generator.py

      # ===============================
      # 📄 Run DISCON PDF generator
      # ===============================
      - name: Run Discon PDF Generator
        if: steps.decide.outputs.result == 'discon'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python discon_script.py

      # ===============================
      # 📦 Upload output PDF
      # ===============================
      - name: Upload PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Catalog PDF
          files: |
            PROFESSIONAL_CATALOG.pdf
            PROFESSIONAL_CATALOG_DISCON.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
